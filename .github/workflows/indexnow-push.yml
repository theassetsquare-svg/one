name: IndexNow Push (Bing/Yandex)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deploy (root + key file)
        run: |
          set -e
          KEY="73db36672cca84c36716390378812042"
          for i in $(seq 1 40); do
            S=$(curl -s -o /dev/null -w "%{http_code}" "https://oned-a0q.pages.dev/")
            K=$(curl -s -o /dev/null -w "%{http_code}" "https://oned-a0q.pages.dev/${KEY}.txt")
            if [ "$S" = "200" ] && [ "$K" = "200" ]; then
              echo "✅ live (/ → 200, key.txt → 200)"; exit 0
            fi
            echo "wait... ($i/40) / → $S, key.txt → $K"
            sleep 15
          done
          echo "❌ live not reachable after wait"
          exit 1
      - name: Submit URLs to IndexNow (sitemap 전체)
        run: |
          set +e
          KEY="73db36672cca84c36716390378812042"
          KEY_URL="https://oned-a0q.pages.dev/${KEY}.txt"
          # 라이브 sitemap.xml 에서 전체 URL 을 뽑아 그대로 제출합니다.
          # (페이지가 늘어도 워크플로를 다시 고칠 필요가 없도록)
          URLS=$(curl -sfL https://oned-a0q.pages.dev/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed 's|<loc>||; s|</loc>||' \
            | awk '{printf "%s\"%s\"", (NR>1 ? "," : ""), $0}')
          COUNT=$(echo "$URLS" | tr ',' '\n' | wc -l)
          echo "제출 URL ${COUNT}개"
          RESP=$(curl -s -o /tmp/in.body -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"oned-a0q.pages.dev\",\"key\":\"${KEY}\",\"keyLocation\":\"${KEY_URL}\",\"urlList\":[${URLS}]}")
          echo "IndexNow response: HTTP $RESP"
          cat /tmp/in.body || true
          # 200 / 202 are success; 422 means already submitted, also OK
          case "$RESP" in
            200|202|422) echo "✅ IndexNow accepted" ;;
            *) echo "❌ IndexNow failed"; exit 1 ;;
          esac
